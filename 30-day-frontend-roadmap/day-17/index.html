<!--
  Day 17: Form di React
  Tugas: input nama lalu tampilkan hasil saat submit.
-->
<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day 17 - React Form</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f0fdf4;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .card {
        width: 420px;
        background: white;
        padding: 24px;
        border-radius: 12px;
        box-shadow: 0 10px 20px rgba(0,0,0,0.08);
      }
      input, button {
        width: 100%;
        box-sizing: border-box;
        margin-top: 12px;
        padding: 10px;
      }
      button {
        background: #16a34a;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
      .hasil {
        margin-top: 20px;
        background: #ecfdf5;
        padding: 12px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const App = () => {
        const [nama, setNama] = React.useState('');
        const [hasil, setHasil] = React.useState('Belum ada nama.');

        const handleSubmit = (e) => {
          e.preventDefault();
          if (!nama.trim()) {
            setHasil('Nama tidak boleh kosong.');
            return;
          }
          setHasil(`Halo, ${nama}! Selamat belajar React.`);
          setNama('');
        };

        return (
          <div className="card">
            <h2>Form React</h2>
            <form onSubmit={handleSubmit}>
              <input
                type="text"
                placeholder="Masukkan nama"
                value={nama}
                onChange={(e) => setNama(e.target.value)}
              />
              <button type="submit">Kirim</button>
            </form>
            <div className="hasil">{hasil}</div>
          </div>
        );
      };

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
