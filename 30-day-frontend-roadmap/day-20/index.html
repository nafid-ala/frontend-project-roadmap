<!--
  Day 20: To-do app React tahap 2
  Tugas: tambah checkbox selesai, status done, dan filter sederhana.
-->
<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day 20 - To-do App React</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #ecfeff;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .card {
        width: 500px;
        background: white;
        padding: 24px;
        border-radius: 12px;
        box-shadow: 0 10px 20px rgba(0,0,0,0.08);
      }
      .row {
        display: flex;
        gap: 10px;
      }
      input, button {
        padding: 10px;
        border-radius: 8px;
      }
      input {
        flex: 1;
      }
      button {
        border: none;
        background: #0891b2;
        color: white;
        cursor: pointer;
      }
      .filters {
        display: flex;
        gap: 8px;
        margin: 14px 0;
      }
      ul {
        list-style: none;
        padding: 0;
      }
      li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 10px 12px;
        margin-top: 8px;
      }
      li.done span {
        text-decoration: line-through;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const App = () => {
        const [tasks, setTasks] = React.useState([
          { id: 1, text: 'Belajar React', done: false },
          { id: 2, text: 'Membuat project', done: true },
        ]);
        const [input, setInput] = React.useState('');
        const [filter, setFilter] = React.useState('all');

        const addTask = () => {
          const value = input.trim();
          if (!value) return;

          setTasks((prev) => [...prev, { id: Date.now(), text: value, done: false }]);
          setInput('');
        };

        const toggleTask = (id) => {
          setTasks((prev) =>
            prev.map((task) =>
              task.id === id ? { ...task, done: !task.done } : task
            )
          );
        };

        const deleteTask = (id) => {
          setTasks((prev) => prev.filter((task) => task.id !== id));
        };

        const filteredTasks =
          filter === 'active'
            ? tasks.filter((task) => !task.done)
            : filter === 'completed'
            ? tasks.filter((task) => task.done)
            : tasks;

        return (
          <div className="card">
            <h2>To-do App</h2>
            <div className="row">
              <input
                type="text"
                value={input}
                onChange={(e) => setInput(e.target.value)}
                placeholder="Masukkan tugas"
              />
              <button onClick={addTask}>Tambah</button>
            </div>

            <div className="filters">
              <button onClick={() => setFilter('all')}>Semua</button>
              <button onClick={() => setFilter('active')}>Aktif</button>
              <button onClick={() => setFilter('completed')}>Selesai</button>
            </div>

            <ul>
              {filteredTasks.map((task) => (
                <li key={task.id} className={task.done ? 'done' : ''}>
                  <label>
                    <input
                      type="checkbox"
                      checked={task.done}
                      onChange={() => toggleTask(task.id)}
                    />
                    <span>{task.text}</span>
                  </label>
                  <button onClick={() => deleteTask(task.id)}>Hapus</button>
                </li>
              ))}
            </ul>
          </div>
        );
      };

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
