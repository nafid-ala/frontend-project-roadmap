<!--
  Day 23: Reusable Component
  Tugas: bikin komponen kecil yang bisa dipakai berulang.
-->
<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day 23 - Reusable Component</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: #f8fafc;
      }
      .box {
        background: white;
        padding: 20px;
        border-radius: 12px;
        width: 420px;
        margin: 10px 0;
        box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const Card = ({ title, desc }) => (
        <div className="box">
          <h3>{title}</h3>
          <p>{desc}</p>
        </div>
      );

      const App = () => (
        <div>
          <Card title="React" desc="Mempelajari component reusable." />
          <Card title="JavaScript" desc="Belajar logic dan data." />
          <Card title="CSS" desc="Menyusun tampilan yang rapi." />
        </div>
      );

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
