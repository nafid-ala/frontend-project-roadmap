  Day 26: Portfolio Mini
  Tugas: buat halaman profil singkat dengan project section.
-->
<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day 26 - Portfolio Mini</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f8fafc;
        margin: 0;
      }
      .container {
        max-width: 900px;
        margin: 40px auto;
        padding: 20px;
      }
      .hero {
        background: white;
        border-radius: 16px;
        padding: 30px;
        box-shadow: 0 15px 25px rgba(0,0,0,0.08);
      }
      .projects {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px;
        margin-top: 20px;
      }
      .project {
        background: white;
        padding: 18px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.06);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const projects = [
        { name: 'To-do App', desc: 'Aplikasi tugas sederhana.' },
        { name: 'Weather App', desc: 'Fetch API cuaca.' },
        { name: 'Portfolio', desc: 'Halaman profil pribadi.' },
      ];

      const App = () => (
        <div className="container">
          <div className="hero">
            <h1>Halo, saya Budi</h1>
            <p>Saya sedang belajar frontend dan membangun project nyata.</p>
            <p>Skill: HTML, CSS, JavaScript, React</p>
          </div>
          <div className="projects">
            {projects.map((project, index) => (
              <div className="project" key={index}>
                <h3>{project.name}</h3>
                <p>{project.desc}</p>
              </div>
            ))}
          </div>
        </div>
      );

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
