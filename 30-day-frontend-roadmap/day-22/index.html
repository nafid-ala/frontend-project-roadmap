<!--
  Day 22: Styling Modern
  Tugas: tampilkan UI yang lebih baik dan rapi.
-->
<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day 22 - Styling Modern</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #dbeafe, #f8fafc);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .card {
        width: 420px;
        background: white;
        border-radius: 18px;
        padding: 24px;
        box-shadow: 0 18px 30px rgba(15, 23, 42, 0.08);
      }
      .pill {
        display: inline-block;
        background: #dbeafe;
        color: #1d4ed8;
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 12px;
        margin-bottom: 10px;
      }
      h2 {
        margin-top: 0;
      }
      button {
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 10px;
        padding: 10px 18px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const App = () => {
        return (
          <div className="card">
            <div className="pill">Frontend</div>
            <h2>UI yang lebih modern</h2>
            <p>Hari ini fokus pada styling dan pengalaman pengguna.</p>
            <button>Pelajari UI</button>
          </div>
        );
      };

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
