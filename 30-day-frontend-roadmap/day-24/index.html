<!--
  Day 24: React Router Sederhana
  Tugas: simulasi navigasi antar halaman dengan state.
-->
<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day 24 - Navigasi Sederhana</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #eef2ff;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .card {
        width: 420px;
        background: white;
        padding: 24px;
        border-radius: 12px;
        box-shadow: 0 14px 25px rgba(0,0,0,0.08);
      }
      nav {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }
      button {
        padding: 10px 14px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        background: #4f46e5;
        color: white;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const App = () => {
        const [page, setPage] = React.useState('home');

        const renderPage = () => {
          if (page === 'home') {
            return <div><h2>Home</h2><p>Ini halaman utama.</p></div>;
          }
          if (page === 'todo') {
            return <div><h2>To-do</h2><p>Daftar tugas bisa ditampilkan di sini.</p></div>;
          }
          return <div><h2>About</h2><p>Belajar frontend dengan project-based learning.</p></div>;
        };

        return (
          <div className="card">
            <nav>
              <button onClick={() => setPage('home')}>Home</button>
              <button onClick={() => setPage('todo')}>Todo</button>
              <button onClick={() => setPage('about')}>About</button>
            </nav>
            {renderPage()}
          </div>
        );
      };

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
