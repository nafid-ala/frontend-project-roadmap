<!--
  Hari ke-13: To-do App Bertahap 2
  Tugas:
  1. tambah fitur checkbox selesai
  2. tambah status done
  3. hadirkan data yang lebih rapi
-->

<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day 13 - To-do App</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #ecfeff;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .card {
        width: 500px;
        background: white;
        padding: 24px;
        border-radius: 12px;
      }
      .row {
        display: flex;
        gap: 10px;
      }
      input {
        flex: 1;
        padding: 10px;
      }
      button {
        padding: 10px 14px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        background: #0891b2;
        color: white;
      }
      ul {
        padding-left: 20px;
      }
      .done span {
        text-decoration: line-through;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>To-do List</h2>
      <div class="row">
        <input id="taskInput" type="text" placeholder="Masukkan tugas" />
        <button id="addBtn">Tambah</button>
      </div>
      <ul id="taskList"></ul>
    </div>

    <script>
      const taskInput = document.getElementById("taskInput");
      const addBtn = document.getElementById("addBtn");
      const taskList = document.getElementById("taskList");

      let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

      function saveTasks() {
        localStorage.setItem("tasks", JSON.stringify(tasks));
      }

      function renderTasks() {
        taskList.innerHTML = "";

        tasks.forEach((task, index) => {
          const li = document.createElement("li");
          li.className = task.done ? "done" : "";

          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = task.done;
          checkbox.addEventListener("change", () => {
            tasks[index].done = !tasks[index].done;
            saveTasks();
            renderTasks();
          });

          const text = document.createElement("span");
          text.textContent = task.name;

          const deleteBtn = document.createElement("button");
          deleteBtn.textContent = "Hapus";
          deleteBtn.addEventListener("click", () => {
            tasks.splice(index, 1);
            saveTasks();
            renderTasks();
          });

          li.appendChild(checkbox);
          li.appendChild(text);
          li.appendChild(deleteBtn);
          taskList.appendChild(li);
        });
      }

      addBtn.addEventListener("click", () => {
        const value = taskInput.value.trim();
        if (!value) {
          alert("Tugas tidak boleh kosong");
          return;
        }

        tasks.push({ name: value, done: false });
        saveTasks();
        renderTasks();
        taskInput.value = "";
      });

      renderTasks();
    </script>
  </body>
</html>
