<!--
  File ini adalah latihan hari ke-2.
  Tugas: buat halaman sederhana yang menampilkan elemen input, button, dan daftar nama.
  Saat tombol ditekan, nama baru ditambahkan ke daftar.
-->

<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hari 2 - Menambah Item</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #eef2ff;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .container {
        background: white;
        border-radius: 12px;
        padding: 24px;
        width: 420px;
      }

      input {
        width: 70%;
        padding: 10px;
        margin-right: 10px;
      }

      button {
        padding: 10px 16px;
        background: #4f46e5;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }

      ul {
        margin-top: 20px;
        padding-left: 20px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Daftar Nama</h2>
      <input id="namaInput" type="text" placeholder="Masukkan nama" />
      <button id="tambahBtn">Tambah</button>
      <ul id="namaList"></ul>
    </div>

    <script>
      // Tugas: tambah item ke daftar saat tombol ditekan.
      const namaInput = document.getElementById("namaInput");
      const tambahBtn = document.getElementById("tambahBtn");
      const namaList = document.getElementById("namaList");

      tambahBtn.addEventListener("click", function () {
        const nama = namaInput.value.trim();

        if (!nama) {
          alert("Nama tidak boleh kosong!");
          return;
        }

        const item = document.createElement("li");
        item.textContent = nama;
        namaList.appendChild(item);
        namaInput.value = "";
        namaInput.focus();
      });
    </script>
  </body>
</html>
