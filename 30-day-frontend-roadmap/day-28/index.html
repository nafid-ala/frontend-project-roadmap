<!--
  Day 28: Project Final Pilihan
  Tugas: pilih salah satu project terbaik untuk ditingkatkan.
-->
<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day 28 - Project Final</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f3f4f6;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .card {
        width: 460px;
        background: white;
        padding: 24px;
        border-radius: 14px;
      }
      .project {
        background: #f8fafc;
        padding: 14px;
        border-radius: 10px;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const projects = [
        'To-do App',
        'Notes App',
        'Weather App',
        'Portfolio',
      ];

      const App = () => (
        <div className="card">
          <h2>Project Pilihan</h2>
          <p>Pilih project yang paling siap dipamerkan:</p>
          {projects.map((item, index) => (
            <div className="project" key={index}>{index + 1}. {item}</div>
          ))}
        </div>
      );

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
